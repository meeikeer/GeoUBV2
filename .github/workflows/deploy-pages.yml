name: Deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# El admin escribe en geodata/ por la Contents API, y cada PUT es un commit a
# main. Ese commit dispara este workflow, que regenera mapdata.json y
# redespliega: es lo que hace que lo que ve el admin llegue a los visitantes
# sin que nadie tenga que desplegar a mano.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; los commits del admin llegan seguidos.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix client

      - name: Regenerar mapdata.json desde geodata/
        run: node scripts/generate-mapdata.mjs

      - name: Build
        run: npm run build --prefix client

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
